name: Run conformance suite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: upstream library releases get re-tested without a push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege by default. The suite job builds and runs third-party
# adapter dependencies (floating PyPI/npm/NuGet/crates and upstream clones), so
# it gets a read-only token that checkout does not persist. Only the publish
# job, which runs no adapter code, can write to gh-pages.
permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install runner
        working-directory: runner
        run: npm ci

      - name: Verify fixture packages match XML fragments
        working-directory: runner
        run: npm run check-fixtures

      - name: Verify committed results schema is current
        working-directory: runner
        run: npm run check-results-schema

      - name: Verify capability registry and generated indexes
        working-directory: runner
        run: npm run check-capability-index

      # An install failure fails CI; runtime library breakage instead surfaces
      # as error cells in the published matrix.
      - name: Install adapter dependencies
        env:
          SAFE_DOCX_REF_MODE: ${{ github.event_name == 'pull_request' && 'pull-request-pinned' || 'tracking' }}
        run: |
          set -euo pipefail
          for adapter in adapters/*/install.sh; do
            if [ -f "$adapter" ]; then bash "$adapter"; fi
          done

      - name: Run suite
        working-directory: runner
        run: npm run suite

      - name: Validate results JSON
        working-directory: runner
        run: npm run validate-results

      - name: Generate capability result aggregation
        working-directory: runner
        run: npm run write-capability-index

      - name: Render matrix view
        working-directory: runner
        run: npm run render-matrix

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/latest.json
            results/results.schema.json
            results/capability-summary.json
            registry/scenario-coverage.json

      - name: Upload rendered results site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: results-site
          path: results/

  publish:
    needs: suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: results-site
          path: results

      - name: Publish results to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results
          destination_dir: results
          keep_files: true
